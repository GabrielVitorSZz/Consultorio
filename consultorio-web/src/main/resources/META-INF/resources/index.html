<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultório Médico - Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🏥</div>
      <h1>Consultório Médico</h1>
      <p>Sistema de Gestão</p>
    </div>
    <div id="alert-area"></div>
    <form id="login-form">
      <div class="form-group" style="margin-bottom:1rem">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required autocomplete="username">
      </div>
      <div class="form-group" style="margin-bottom:1.5rem">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.75rem">
        Entrar
      </button>
    </form>
    <div style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid #eee;font-size:.8rem;color:#999;text-align:center">
      <strong>Usuários de demonstração (senha: 123456)</strong><br>
      admin@consultorio.com | carlos@consultorio.com<br>
      ana@consultorio.com | maria@consultorio.com
    </div>
  </div>
</div>
<script src="/js/auth.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = '/pages/dashboard.html';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.textContent = 'Entrando...'; btn.disabled = true;
    const alertArea = document.getElementById('alert-area');
    alertArea.innerHTML = '';
    try {
      await Auth.login(document.getElementById('email').value, document.getElementById('senha').value);
      window.location.href = '/pages/dashboard.html';
    } catch (err) {
      alertArea.innerHTML = `<div class="alert alert-error">❌ ${err.message}</div>`;
      btn.textContent = 'Entrar'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
